<meta name="theme-color" content="#f7f7f9">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<link rel="manifest" href="manifest.json">

<title>Krutotraktor – zabezpečený přístup</title>
<style>
:root{color-scheme:light;--bg:#f7f7f9;--card:#ffffff;--text:#000000;--border:#e8e8ef;--accent:#d32525;--accent-2:#cf2b2b;--danger:#b00020}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.card{width:min(420px,100%);background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px 22px 24px;box-shadow:0 14px 38px rgba(0,0,0,.08)}
.logo{display:flex;justify-content:center;margin:0 0 24px}.logo img{display:block;width:160px;height:auto;border-radius:24px}
form{margin:0}
input[type=text]{display:block;width:100%;margin:0;padding:15px 16px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;color:#000;outline:none;font:800 1rem/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:center;letter-spacing:.04em;box-shadow:none;-webkit-appearance:none;appearance:none}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(211,37,37,.16)}
button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:12px;padding:13px 16px;border:0;border-radius:18px;background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;font:900 1rem/1.1 -apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif;cursor:pointer;-webkit-appearance:none;appearance:none}
button:active{transform:translateY(1px)}button:disabled{opacity:.6;cursor:wait}
.card.error input[type=text]{border-color:var(--danger);box-shadow:0 0 0 3px rgba(176,0,32,.14);animation:unlockShake .22s linear 1}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
@keyframes unlockShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(max-width:520px){body{padding-left:16px;padding-right:16px}.card{padding:24px 18px 20px}.logo img{width:150px}}
</style>
</head>
<body>
<main class="card" id="unlockCard" hidden>
  <div class="logo"><img src="icon-192.png" alt="Hermle"></div>
  <form id="unlockForm" autocomplete="off">
    <input id="daily" type="text" inputmode="text" maxlength="22" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Kód" required>
    <input id="remember" type="checkbox" checked hidden>
    <button id="unlockBtn" type="submit">Odemknout</button>
  </form>
  <div class="sr-only" id="status" aria-live="polite"></div>
</main>

const SESSION_DAY_KEY = 'krut_secure_session_v1';
const SKIP_AUTO_KEY = 'krut_secure_skip_auto_once_v1';
const DEVICE_RECORD_ID = "remembered-device";
const LOCK_RECORD_ID = "unlock-lock-v1";
const MAX_ATTEMPTS = 10;
const DEVICE_DB_NAME = "krut_secure_device_v6_fresh";
const DEVICE_STORE_NAME = "secure";
const OLD_DEVICE_DB_NAMES = ['krut_secure_device_v4','krut_secure_device_v3','krut_secure_device_v2','krut_secure_device_v1'];
const enc = new TextEncoder();
const dec = new TextDecoder();

function b64ToBytes(value){const raw=atob(value);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out;}
function bytesToB64(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s);}
function b64urlToBytes(value){const normalized=String(value||'').replace(/-/g,'+').replace(/_/g,'/');const padded=normalized+'='.repeat((4-normalized.length%4)%4);return b64ToBytes(padded);}
function dateKey(){const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;}
function normalizeDaily(value){return String(value||'').replace(/[^A-Za-z0-9_-]/g,'');}
function setStatus(text,error=false){const el=document.getElementById('status');if(el)el.textContent=text;const card=document.getElementById('unlockCard');if(card)card.classList.toggle('error',!!error);}
function openDeviceDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DEVICE_DB_NAME,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DEVICE_STORE_NAME))db.createObjectStore(DEVICE_STORE_NAME,{keyPath:'id'});};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('IndexedDB nelze otevřít.'));
  });
}
async function idbGet(id){const db=await openDeviceDb();try{return await new Promise((resolve,reject)=>{const tx=db.transaction(DEVICE_STORE_NAME,'readonly');const req=tx.objectStore(DEVICE_STORE_NAME).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});}finally{db.close();}}
async function idbPut(record){const db=await openDeviceDb();try{await new Promise((resolve,reject)=>{const tx=db.transaction(DEVICE_STORE_NAME,'readwrite');tx.objectStore(DEVICE_STORE_NAME).put(record);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Uložení zařízení bylo přerušeno.'));});}finally{db.close();}}
async function idbDelete(id){const db=await openDeviceDb();try{await new Promise((resolve,reject)=>{const tx=db.transaction(DEVICE_STORE_NAME,'readwrite');tx.objectStore(DEVICE_STORE_NAME).delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}finally{db.close();}}
function deleteOldDeviceDb(name){return new Promise(resolve=>{try{const req=indexedDB.deleteDatabase(name);const done=()=>resolve();req.onsuccess=done;req.onerror=done;req.onblocked=done;setTimeout(done,400);}catch(e){resolve();}});}
async function purgeOldDeviceDbs(){for(const name of OLD_DEVICE_DB_NAMES){if(name!==DEVICE_DB_NAME)await deleteOldDeviceDb(name);}}
function deviceWrapAad(){return enc.encode(`KRUTOTRAKTOR_DEVICE_WRAP_V6_FRESH|${location.origin}`);}
async function saveRemembered(dekRaw){
  const deviceKey=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const wrapped=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:deviceWrapAad(),tagLength:128},deviceKey,dekRaw));
  await idbPut({id:DEVICE_RECORD_ID,version:6,build:BUILD_ID,key:deviceKey,iv,wrapped,updatedAt:Date.now()});
  try{localStorage.removeItem('krut_secure_remembered_key_v1');}catch(e){}
  try{localStorage.removeItem('krut_secure_faceid_v2');}catch(e){}
}
async function removeRemembered(){try{await idbDelete(DEVICE_RECORD_ID);}catch(e){}try{localStorage.removeItem('krut_secure_remembered_key_v1');}catch(e){}try{localStorage.removeItem('krut_secure_faceid_v2');}catch(e){}}
async function readRememberedDevice(){
  const record=await idbGet(DEVICE_RECORD_ID);
  if(!record?.key||!record?.iv||!record?.wrapped)return null;
  const raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(record.iv),additionalData:deviceWrapAad(),tagLength:128},record.key,new Uint8Array(record.wrapped)));
  return {build:String(record.build||''),key:raw};
}
window.__KRUT_FORGET_DEVICE__=removeRemembered;

async function loadPacked(){if(APP_DATA_B64)return b64ToBytes(APP_DATA_B64);const response=await fetch(APP_FILE,{cache:'no-store'});if(!response.ok)throw new Error('Zašifrovaný balíček nelze načíst.');return new Uint8Array(await response.arrayBuffer());}
async function decryptApp(dekRaw){
  const packed=await loadPacked();
  if(packed.length<29)throw new Error('Zašifrovaný balíček je poškozený.');
  const appKey=await crypto.subtle.importKey('raw',dekRaw,{name:'AES-GCM'},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:packed.slice(0,12),additionalData:enc.encode(`KRUTOTRAKTOR_APP_V1|${BUILD_ID}`),tagLength:128},appKey,packed.slice(12));
  const html=dec.decode(plain);
  if(!html.includes('<html')||!html.includes('</html>'))throw new Error('Rozšifrovaný obsah není platný.');
  return html;
}
async function openWithDek(dekRaw,{remember=false}={}){
  const html=await decryptApp(dekRaw);
  try{sessionStorage.removeItem('krut_secure_session_dek_v3');sessionStorage.removeItem('krut_secure_session_dek_v2');sessionStorage.setItem(SESSION_DAY_KEY,dateKey());}catch(e){}
  if(remember)await saveRemembered(dekRaw);
  await resetFailureState();
  document.open();document.write(html);document.close();
}
async function deriveAppKeyFromDaily(daily,date){
  const encoded=b64urlToBytes(daily);
  if(encoded.length!==16)throw new DOMException('Invalid daily code','OperationError');
  const mask=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(`KRUTOTRAKTOR_DAILY_MASK_V5|${date}`)));
  const master=new Uint8Array(16);for(let i=0;i<16;i++)master[i]=encoded[i]^mask[i];
  const material=await crypto.subtle.importKey('raw',master,'HKDF',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'HKDF',hash:'SHA-256',salt:enc.encode('KRUTOTRAKTOR_APP_SALT_V5'),info:enc.encode('KRUTOTRAKTOR_APP_KEY_V5')},material,256);
  master.fill(0);
  return new Uint8Array(bits);
}
async function manualDecrypt(daily){return deriveAppKeyFromDaily(daily,dateKey());}
async function readFailureState(){
  try{
    const record=await idbGet(LOCK_RECORD_ID);
    return {count:Number(record?.count||0),locked:record?.locked===true};
  }catch(e){return {count:0,locked:false};}
}
async function resetFailureState(){try{await idbDelete(LOCK_RECORD_ID);}catch(e){}}
async function wipeLocalAccess(){
  await removeRemembered();
  try{sessionStorage.removeItem('krut_secure_session_dek_v3');sessionStorage.removeItem('krut_secure_session_dek_v2');sessionStorage.removeItem(SESSION_DAY_KEY);sessionStorage.removeItem(SKIP_AUTO_KEY);}catch(e){}
  try{localStorage.removeItem('krut_secure_remembered_key_v1');localStorage.removeItem('krut_secure_faceid_v2');}catch(e){}
  try{for(const name of await caches.keys())await caches.delete(name);}catch(e){}
  try{for(const registration of await navigator.serviceWorker?.getRegistrations?.()||[])await registration.unregister();}catch(e){}
}
async function registerFailure(){
  const previous=await readFailureState();
  const count=Math.min(MAX_ATTEMPTS,previous.count+1);
  const locked=count>=MAX_ATTEMPTS;
  await idbPut({id:LOCK_RECORD_ID,version:1,count,locked,updatedAt:Date.now(),build:BUILD_ID});
  if(locked)await wipeLocalAccess();
  return {count,locked};
}
function showLocked(){
  const card=document.getElementById('unlockCard');
  const input=document.getElementById('daily');
  const button=document.getElementById('unlockBtn');
  card.hidden=false;card.classList.add('error');
  input.value='';input.disabled=true;
  button.disabled=true;button.textContent='Zablokováno';
  setStatus('Zařízení je po deseti neúspěšných pokusech zablokované.',true);
}
async function tryDeviceRecord(){
  try{const saved=await readRememberedDevice();if(!saved)return false;await openWithDek(saved.key,{remember:false});return true;}catch(e){console.warn('Zabezpečený záznam zařízení nebyl použit:',e);return false;}
}
async function bootstrap(){
  try{
    await purgeOldDeviceDbs();
    try{sessionStorage.removeItem('krut_secure_session_dek_v3');sessionStorage.removeItem('krut_secure_session_dek_v2');}catch(e){}
    try{localStorage.removeItem('krut_secure_remembered_key_v1');localStorage.removeItem('krut_secure_faceid_v2');}catch(e){}
    const state=await readFailureState();
    if(state.locked){showLocked();return;}
    if(sessionStorage.getItem(SKIP_AUTO_KEY)==='1')sessionStorage.removeItem(SKIP_AUTO_KEY);
    else if(await tryDeviceRecord())return;
  }catch(e){console.error(e);}
  const card=document.getElementById('unlockCard');card.hidden=false;try{document.getElementById('daily').focus({preventScroll:true});}catch(e){}
}
document.getElementById('unlockForm').addEventListener('submit',async(e)=>{
  e.preventDefault();const button=document.getElementById('unlockBtn');const daily=normalizeDaily(document.getElementById('daily').value);
  if(!daily){setStatus('Zadejte dnešní kód.',true);return;}
  const before=await readFailureState();if(before.locked){showLocked();return;}
  button.disabled=true;setStatus('Ověřuji a rozšifrovávám…');
  try{const dekRaw=await manualDecrypt(daily);const remember=document.getElementById('remember').checked;if(!remember)await removeRemembered();await openWithDek(dekRaw,{remember});}
  catch(err){
    console.error(err);
    const state=await registerFailure();
    if(state.locked){showLocked();return;}
    setStatus('Neplatný kód.',true);
    await new Promise(r=>setTimeout(r,Math.min(10000,1000*state.count)));
    button.disabled=false;
  }
});
bootstrap();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.error));
</script>
